# Full-stack bring-up: API + frontend + PostgreSQL + Redis in one command.
#
# `docker compose up --build` starts everything; login → dashboard works at
# http://localhost:3000 (frontend) against http://localhost:8000 (API).
#
# This is the full application artifact. docker/docker-compose.yml remains
# the lighter backend-only dev infra (Postgres + Redis on host ports) for
# developers who run `uv run uvicorn --reload` / `npm run dev` on the host
# against it (DD-018).
#
# Env var defaults mirror .env.example. SECRET_KEY must be overridden for any
# shared deployment; EMAIL_ENABLED defaults off here (SMTP stays a no-op).
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: ${POSTGRES_DB:-timetable_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-timetable_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      DB_NAME: ${POSTGRES_DB:-timetable_db}
      SECRET_KEY: ${SECRET_KEY:-your-strong-random-secret-key-here-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      ASYNC_GENERATION: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle; the browser reaches the API directly
        # at this URL (DD-019). Override when the API is hosted elsewhere.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      # Next's standalone server binds to $HOSTNAME, which Docker auto-sets to
      # the container id (an unresolvable name) — pin it to the wildcard.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  pgdata:
